name: release

# push tag(v* )或手动 → 原生 Mac(Swift)+ Tauri(mac universal / Windows)出包发 release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 手动 dispatch(无 tag)不发版:ref_name 会是分支名,tauri-action 会建出畸形 tag/release
  # (评审 E1)——dispatch 仅允许用于调试编译,产物不发布
  # 原生 Mac 版(Swift + AppKit):build.sh 的打包步骤(去掉启动)
  native-mac:
    if: startsWith(github.ref, 'refs/tags/')   # 仅 tag 构建(E1)
    runs-on: macos-latest
    env:
      KF_SIGN_P12_B64: ${{ secrets.KF_SIGN_P12_B64 }}
      KF_SIGN_P12_PASS: ${{ secrets.KF_SIGN_P12_PASS }}
      # v1.6.0:Developer ID 正式签名 + 公证(凭证在 Secrets,缺失时回退自签不公证)
      APPLE_DEV_ID_P12_B64: ${{ secrets.APPLE_DEV_ID_P12_B64 }}
      APPLE_DEV_ID_P12_PASS: ${{ secrets.APPLE_DEV_ID_P12_PASS }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7(pin SHA,评审 B1)

      # 评审 B9:发版机器防线——tag 必须与仓库三处版本一致(分叉会触发"装完新版仍报有新版"更新循环)
      - name: 版本一致性门(tag == 仓库三处)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          read -r T P C <<< "$(python3 - <<'PY'
          import json, re
          print(json.load(open('windows/src-tauri/tauri.conf.json'))['version'],
                json.load(open('windows/package.json'))['version'],
                re.search(r'^version = "(.+)"', open('windows/src-tauri/Cargo.toml').read(), re.M).group(1))
          PY
          )"
          echo "tag=$TAG tauri=$T package=$P cargo=$C"
          [[ "$TAG" == "$T" && "$TAG" == "$P" && "$TAG" == "$C" ]] || { echo "::error::版本不一致:先提版本同步提交再打 tag(三处同 bump)"; exit 1; }

      - name: SwiftPM 编译(release)
        run: swift build -c release --product KingfisherPet

      - name: 纯逻辑单测门(评审 B8:tag 直发不再绕过测试)
        run: swift run -c release kf-tests

      - name: 组装 .app(与 build.sh 一致)
        env:
          KF_SIGN_P12_B64: ${{ secrets.KF_SIGN_P12_B64 }}
          KF_SIGN_P12_PASS: ${{ secrets.KF_SIGN_P12_PASS }}
          APPLE_DEV_ID_P12_B64: ${{ secrets.APPLE_DEV_ID_P12_B64 }}
          APPLE_DEV_ID_P12_PASS: ${{ secrets.APPLE_DEV_ID_P12_PASS }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="build/KingfisherPet.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/Sprites"
          cp .build/release/KingfisherPet "$APP/Contents/MacOS/"
          for d in Resources/Sprites/*/; do
            t=$(basename "$d"); mkdir -p "$APP/Contents/Resources/Sprites/$t"
            # 分条容错(对齐 build.sh):一条 || true 会因任一 json 缺失丢掉整主题 png(评审)
            cp "$d"*.png "$APP/Contents/Resources/Sprites/$t/" || echo "::warning::$t 缺 png"
            cp "$d"sprites.json "$APP/Contents/Resources/Sprites/$t/" || { echo "::error::$t 缺 sprites.json(主题丢 manifest=切主题鸟静止,评审 B3)"; exit 1; }
            cp "$d"colors.json "$APP/Contents/Resources/Sprites/$t/" || echo "::warning::$t 缺 colors.json"
            rm -f "$APP/Contents/Resources/Sprites/$t/contact.png"
          done
          cp Resources/peep_*.wav "$APP/Contents/Resources/"
          ICONSET="$(mktemp -d)/AppIcon.iconset"; mkdir -p "$ICONSET"
          SRC="Resources/Sprites/flat/idle_0.png"
          for spec in "16" "32 16@2x" "32" "64 32@2x" "128" "256 128@2x" "256" "512 256@2x" "512" "1024 512@2x" "1024"; do
            set -- $spec
            if [[ $# -eq 1 ]]; then sips -z "$1" "$1" "$SRC" --out "$ICONSET/icon_${1}x${1}.png" >/dev/null
            else sips -z "$1" "$1" "$SRC" --out "$ICONSET/icon_${2}.png" >/dev/null; fi
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>翡 · KingfisherPet</string>
          <key>CFBundleDisplayName</key><string>翡</string>
          <key>CFBundleIdentifier</key><string>com.hizml.kingfisher-pet</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleShortVersionString</key><string>1.3.0</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleExecutable</key><string>KingfisherPet</string>
          <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
          <key>LSMinimumSystemVersion</key><string>13.0</string>
          <key>LSUIElement</key><true/>
          <key>NSHighResolutionCapable</key><true/>
          <key>NSPrincipalClass</key><string>NSApplication</string>
          <key>CFBundleDevelopmentRegion</key><string>zh-Hans</string>
          <key>CFBundleLocalizations</key><array><string>zh-Hans</string><string>en</string></array>
          <key>CFBundleIconFile</key><string>AppIcon</string>
          </dict></plist>
          PLIST
          # 版本号:tag 构建用 tag 号,dispatch 构建读 tauri.conf.json(不再硬编码)
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python3 -c "import json;print(json.load(open('windows/src-tauri/tauri.conf.json'))['version'])")
          fi
          sed -i '' "s/<string>1\.3\.0<\/string>/<string>${VERSION}<\/string>/" "$APP/Contents/Info.plist"
          grep -q "<string>${VERSION}</string>" "$APP/Contents/Info.plist" || { echo "::error::版本号写入失败($VERSION)"; exit 1; }
          # v1.6.0:Developer ID 正式签名 + notarytool 公证(免右键打开的完整链)。
          # 凭证缺失(fork)回退自签证书 → 无自签回退 ad-hoc,均不公证(fork 能出包)
          DEV_ID="Developer ID Application: MengLong Zhao (5CTLSL2C9X)"
          if [ -n "$APPLE_DEV_ID_P12_B64" ]; then
            security create-keychain -p ci /tmp/kf-ci.keychain-db
            security unlock-keychain -p ci /tmp/kf-ci.keychain-db
            echo "$APPLE_DEV_ID_P12_B64" | base64 -d > /tmp/devid.p12
            security import /tmp/devid.p12 -k /tmp/kf-ci.keychain-db -P "$APPLE_DEV_ID_P12_PASS" -T /usr/bin/codesign
            # G2 中介证书(公开物,入库 tools/certs/;runner 镜像没有它信任链会断)
            security import tools/certs/DeveloperIDG2CA.pem -k /tmp/kf-ci.keychain-db
            security list-keychains -s /tmp/kf-ci.keychain-db
            security set-key-partition-list -S apple-tool:,apple: -k ci /tmp/kf-ci.keychain-db
            codesign -s "$DEV_ID" --force --deep --options runtime --timestamp "$APP" \
              || { echo "::error::Developer ID 签名失败"; exit 1; }
            codesign --verify --strict "$APP" || echo "::warning::签名校验失败"
            security list-keychains -s ~/Library/Keychains/login.keychain-db || true
            rm -f /tmp/devid.p12 /tmp/kf-ci.keychain-db*
            # 公证:zip 提交 Apple 扫描(--wait 阻塞到出结果)→ staple 进 .app → 重打正式 zip
            cd build && zip -qry KingfisherPet-mac-native.zip KingfisherPet.app && cd ..
            if xcrun notarytool submit build/KingfisherPet-mac-native.zip \
                 --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait; then
              xcrun stapler staple "$APP" || echo "::warning::staple 失败(在线公证仍有效)"
              rm build/KingfisherPet-mac-native.zip
              cd build && zip -qry KingfisherPet-mac-native.zip KingfisherPet.app && cd ..
            else
              echo "::error::公证失败——v1.6.0 起签名+公证是发版承诺,不出半吊子产物(评审 B2)"
              exit 1
            fi
          elif [ -n "$KF_SIGN_P12_B64" ]; then
            echo "$KF_SIGN_P12_B64" | base64 -d > /tmp/kf.p12
            security create-keychain -p ci /tmp/kf-ci.keychain-db
            security unlock-keychain -p ci /tmp/kf-ci.keychain-db
            security import /tmp/kf.p12 -k /tmp/kf-ci.keychain-db -P "$KF_SIGN_P12_PASS" -T /usr/bin/codesign
            security list-keychains -s /tmp/kf-ci.keychain-db
            security set-key-partition-list -S apple-tool:,apple: -k ci /tmp/kf-ci.keychain-db
            if codesign -s "KingfisherPet Dev" --force --deep "$APP"; then
              codesign --verify --strict "$APP" || echo "::warning::签名校验失败"
            else
              echo "::warning::固定签名失败,已回退 ad-hoc——用户的辅助功能授权将随本包失效"
              codesign -s - --force --deep "$APP"
            fi
            security list-keychains -s ~/Library/Keychains/login.keychain-db || true
            rm -f /tmp/kf.p12 /tmp/kf-ci.keychain-db*
            cd build && zip -qry KingfisherPet-mac-native.zip KingfisherPet.app
          else
            codesign -s - --force --deep "$APP"
            cd build && zip -qry KingfisherPet-mac-native.zip KingfisherPet.app
          fi

      - name: 传到 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2(pin SHA,评审 B1)
        with:
          name: "翡 KingfisherPet ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: true
          files: build/KingfisherPet-mac-native.zip

  build:
    if: startsWith(github.ref, 'refs/tags/')   # 仅 tag 构建(E1)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tauri 线专注 Windows;Mac 走上面的 native-mac(Swift 原生版,功能完整)。
          # Tauri mac 包的窗口探测 Rust 侧只有 Win32 实现(其余是空桩),鸟行为残废,已裁定放弃。
          - platform: windows-latest
            args: ""
            rustTargets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7(pin SHA,评审 B1)

      # 评审 B9:发版机器防线——tag 必须与仓库三处版本一致(分叉会触发"装完新版仍报有新版"更新循环)
      - name: 版本一致性门(tag == 仓库三处)
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          read -r T P C <<< "$(python3 - <<'PY'
          import json, re
          print(json.load(open('windows/src-tauri/tauri.conf.json'))['version'],
                json.load(open('windows/package.json'))['version'],
                re.search(r'^version = "(.+)"', open('windows/src-tauri/Cargo.toml').read(), re.M).group(1))
          PY
          )"
          echo "tag=$TAG tauri=$T package=$P cargo=$C"
          [[ "$TAG" == "$T" && "$TAG" == "$P" && "$TAG" == "$C" ]] || { echo "::error::版本不一致:先提版本同步提交再打 tag(三处同 bump)"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable(pin SHA,评审 B1)
        with:
          targets: ${{ matrix.rustTargets }}

      - name: 缓存 cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: 安装前端依赖
        run: npm ci
        working-directory: windows

      - name: 版本号跟 tag(v1.3.1 → 1.3.1,写入 tauri.conf.json)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p='windows/src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');console.log('tauri version →',j.version)" "$VERSION"

      - name: 纯逻辑单测门(node --test;评审 B8)
        working-directory: windows
        run: npm ci && npm test

      - name: 构建 + 发 release(tauri-action)
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0(pin SHA,评审 B1)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v1.6.0 updater 产物签名(createUpdaterArtifacts 需要私钥;tauri-action 自动产 latest.json)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: windows
          tagName: ${{ github.ref_name }}
          releaseName: "翡 KingfisherPet ${{ github.ref_name }}"
          releaseBody: "桌面宠物(Tauri Windows 版;Mac 请用原生版 KingfisherPet-mac-native.zip"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
