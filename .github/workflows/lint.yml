name: lint
on:
  push:
    branches: [main]
    paths: ["windows/**", "Sources/**", "Tests/**", "Package.swift", ".github/workflows/lint.yml"]
  pull_request:
    paths: ["windows/**", "Sources/**", "Tests/**", "Package.swift", ".github/workflows/lint.yml"]

jobs:
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - name: "禁 as any / : any(幽灵API事故的机器防线;: any 同样绕过类型检查,一并拦)"
        shell: bash
        run: |
          if grep -rnE "as any|: any" windows/src --include="*.ts"; then
            echo "::error::windows/src 出现 as any / : any —— 它绕过类型检查,正是 currentMonitor 幽灵调用活下来的原因。请写正确类型。"
            exit 1
          fi
      - name: 纯逻辑单测(node --test,零依赖;版本比较教训:正常流对、边界态错的 bug 靠它拦)
        working-directory: windows
        run: npm ci && npm test
      - name: 前端类型检查 + 构建(tsc --noEmit,不再产出会遮蔽 .ts 的 .js)
        working-directory: windows
        run: npm run build
      - name: 版本号三处一致性(tauri.conf / package.json / Cargo.toml;版本比较 bug 同类:漂移在正常流里隐形)
        shell: bash
        run: |
          node -e "
          const fs=require('fs');
          const t=JSON.parse(fs.readFileSync('windows/src-tauri/tauri.conf.json')).version;
          const p=JSON.parse(fs.readFileSync('windows/package.json')).version;
          const c=/^version = \"(.+)\"/m.exec(fs.readFileSync('windows/src-tauri/Cargo.toml')).at(1);
          if(!(t===p&&p===c)){console.error('::error::版本不一致 tauri.conf='+t+' package='+p+' Cargo='+c);process.exit(1)}
          console.log('版本一致:',t);
          "
      - name: Rust 检查(Windows target,tag 前抓 cfg(windows) 编译错)
        working-directory: windows/src-tauri
        run: cargo check

  mac-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Swift 端此前无任何 CI 检查:编译错误要等 tag 触发 release 才暴露(评审 E4)
      - name: Swift 编译检查
        run: swift build -c release --product KingfisherPet
      # 纯逻辑单测(kf-tests 零依赖 runner;CLT/CI 都能跑)
      - name: 纯逻辑单测(kf-tests)
        run: swift run -c release kf-tests
