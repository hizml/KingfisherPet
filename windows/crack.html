<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh}canvas{position:fixed;left:0;top:0;width:100vw;height:100vh}</style>
</head><body>
<canvas id="c"></canvas>
<script type="module">
import { listen, emit } from "@tauri-apps/api/event";
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
function resize() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
resize(); window.addEventListener("resize", resize);
const MAX_CRACKS = 8;                        // 上限(macOS maxCracks=8,防无限累积)
let cracks = [];                             // {x,y,r}
listen("crack-at", (e) => {
  const { x, y } = e.payload;
  // 55px 内已有裂纹 → 扩大它;否则新建(到上限不建)。对应 macOS peck 合并/生长
  let near = null;   // 从最新往旧找(不 reverse 原数组)
for (let i = cracks.length - 1; i >= 0; i--) {
  if (Math.hypot(cracks[i].x - x, cracks[i].y - y) < 55) { near = cracks[i]; break; }
}
  if (near) {
    near.r = Math.min(180, near.r + 18);
    drawC(near);
    return;
  }
  if (cracks.length >= MAX_CRACKS) return;
  const c = { x, y, r: 44 };
  cracks.push(c);
  drawC(c);
});
function drawC(c) {
  ctx.strokeStyle = crackDark;
  ctx.lineWidth = 2; ctx.lineCap = "round";
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * Math.PI * 2 + Math.random() * 0.3;
    ctx.beginPath(); ctx.moveTo(c.x, c.y);
    ctx.lineTo(c.x + Math.cos(a) * (c.r * (0.7 + Math.random() * 0.3)), c.y + Math.sin(a) * (c.r * (0.7 + Math.random() * 0.3)));
    ctx.stroke();
  }
}
listen("crack-clear", () => { cracks = []; ctx.clearRect(0, 0, cv.width, cv.height); });
emit("child-ready", "crack");   // listener 已注册
</script>
</body></html>
