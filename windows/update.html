<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>翡</title>
  <style>
    body { margin: 0; padding: 16px 18px; font: 13px system-ui, "Segoe UI", sans-serif;
           background: #f6f6f6; color: #222; user-select: none; }
    .ttl { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .msg { line-height: 1.6; color: #444; white-space: pre-line; }
    .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
    button { padding: 5px 14px; font-size: 12.5px; cursor: pointer;
             border: 1px solid #bbb; border-radius: 6px; background: #fff; }
    button.primary { background: #0e7c86; color: #fff; border-color: #0e7c86; }
  </style>
</head>
<body>
  <div class="ttl" id="t"></div>
  <div class="msg" id="m"></div>
  <div class="btns" id="b"></div>
  <script type="module">
    import { getCurrentWindow } from "@tauri-apps/api/window";
    import { invoke } from "@tauri-apps/api/core";
    // 内容由 query 驱动:t=found|latest|error|guide,latest=/cur= 版本号
    const q = new URLSearchParams(location.search);
    const lang = localStorage.getItem("kf_lang") || "system";
    const zh = lang === "zh" || (lang === "system" && (navigator.language || "en").toLowerCase().startsWith("zh"));
    const close = () => getCurrentWindow().close();
    const open = (url) => invoke("open_url", { url });   // 失败(Reject)由调用方决定是否关窗
    const L = {
      foundT: zh ? "发现新版本" : "New Version Available",
      foundM: zh ? (l, c) => `最新 ${l}\n当前 v${c}。前往下载?` : (l, c) => `Latest ${l}\nCurrent v${c}. Download now?`,
      latestT: zh ? "已是最新版本" : "Up to Date",
      latestM: (c) => zh ? `当前 v${c},已是最新。` : `You are on v${c}, the latest.`,
      errT: zh ? "检查更新失败" : "Update Check Failed",
      errM: zh ? "无法访问 GitHub(网络原因)。\n可手动前往 Releases 页查看。" : "Cannot reach GitHub (network).\nYou can check the Releases page manually.",
      aboutT: "翡 · KingfisherPet",
      aboutM: zh ? "一只住在你 Windows 上的小生灵。\n它会自己活动,也会回应你——\n至于它都会些什么,养着养着就知道了。\n\n点它、拖它,或者就让它待着。"
                 : "A little creature living on your Windows.\nIt does its own thing, and answers to you—\nwhat it can do, you'll discover as you keep it around.\n\nClick it, drag it, or just let it be.",
      githubB: zh ? "GitHub 主页" : "GitHub Page",
      guideT: zh ? "翠鸟已住进任务栏" : "Fei Is Now in Your Taskbar",
      guideM: zh ? "Windows 默认会把新图标收进任务栏右下角的 ^ 溢出区。\n想让它常驻可见:设置 → 个性化 → 任务栏 → 其他系统托盘图标 → 打开「翡」。"
                  : "Windows hides new tray icons in the ^ overflow flyout by default.\nTo keep it visible: Settings → Personalization → Taskbar →\nOther system tray icons → turn on Fei.",
      go: zh ? "前往下载" : "Download", later: zh ? "稍后" : "Later", ok: zh ? "好" : "OK",
      openSet: zh ? "打开任务栏设置" : "Open Taskbar Settings",
      openRel: zh ? "打开 Releases 页" : "Open Releases", closeB: zh ? "关闭" : "Close",
    };
    const t = q.get("t") || "error", latest = q.get("latest") || "", cur = q.get("cur") || "";   // 无参/异常一律按失败弹(默认"已是最新"会误导)
    const elT = document.getElementById("t"), elM = document.getElementById("m"), elB = document.getElementById("b");
    const btn = (txt, primary, fn) => { const b = document.createElement("button");
      if (primary) b.className = "primary"; b.textContent = txt; b.onclick = fn; elB.appendChild(b); };
    const REL = "https://github.com/hizml/KingfisherPet/releases/latest";
    if (t === "found") { elT.textContent = L.foundT; elM.textContent = L.foundM(latest, cur);
      btn(L.go, true, () => { open(REL).then(() => close(), () => {}); }); btn(L.later, false, close); }
    else if (t === "latest") { elT.textContent = L.latestT; elM.textContent = L.latestM(cur); btn(L.ok, true, close); }
    else if (t === "error") { elT.textContent = L.errT; elM.textContent = L.errM;
      btn(L.openRel, true, () => { open(REL).then(() => close(), () => {}); }); btn(L.closeB, false, close); }
    else if (t === "guide") { elT.textContent = L.guideT; elM.textContent = L.guideM;
      btn(L.openSet, true, () => { open("ms-settings:taskbar").then(() => close(), () => {}); }); btn(L.later, false, close); }
    else { elT.textContent = L.aboutT;
      // 版本行(关于弹窗此前没版本号,老板要求)
      if (cur) { const v = document.createElement("div"); v.textContent = (zh ? "当前版本 v" : "Version v") + cur; v.style.cssText = "color:#0e7c86;font-weight:600;margin-bottom:8px;"; elM.before(v); }
      elM.textContent = L.aboutM;
      // 鸟图标(关于窗专属,Mac NSAlert.icon 同款)
      const img = document.createElement("img");
      img.src = new URL("Sprites/flat/idle_0.png", import.meta.env.BASE_URL).href;
      img.style.cssText = "position:absolute;top:14px;right:16px;width:52px;image-rendering:pixelated;";
      document.body.style.position = "relative";
      document.body.appendChild(img);
      btn(L.githubB, true, () => { open("https://github.com/hizml/KingfisherPet").then(() => close(), () => {}); }); btn(L.ok, false, close); }
  </script>
</body>
</html>
