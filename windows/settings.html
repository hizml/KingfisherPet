<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>翡 · 设置</title>
  <style>
    body { margin: 0; padding: 14px 16px; font: 13px system-ui, "Segoe UI", sans-serif;
           background: #f6f6f6; color: #222; user-select: none; }
    .row { margin: 10px 0 14px; }
    .lbl { display: flex; justify-content: space-between; margin-bottom: 4px; }
    input[type=range] { width: 100%; }
    .themes { display: flex; gap: 6px; flex-wrap: wrap; }
    .themes button { padding: 4px 10px; font-size: 12px; cursor: pointer;
      border: 1px solid #bbb; border-radius: 6px; background: #fff; }
    .themes button.on { background: #0e7c86; color: #fff; border-color: #0e7c86; }
    label.chk { display: flex; gap: 6px; align-items: center; cursor: pointer; }
    .wx .note { font-size: 11px; color: #777; margin: 4px 0 8px; }
    .wx .wxrow { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .wx .wxrow .k { width: 58px; flex: none; color: #555; }
    .wx .wxrow input, .wx .wxrow select { flex: 1; padding: 3px 6px; border: 1px solid #bbb;
      border-radius: 6px; font: inherit; background: #fff; min-width: 0; }
    .wx .wxstat { font-size: 11px; color: #777; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="row">
    <div class="lbl"><span>活跃度 Activity</span><span id="actV">0.5</span></div>
    <input id="act" type="range" min="0" max="1" step="0.05" value="0.5" />
  </div>
  <div class="row">
    <div class="lbl"><span>动画速度 Speed</span><span id="spdV">1.0</span></div>
    <input id="spd" type="range" min="0.5" max="1.5" step="0.05" value="1.0" />
  </div>
  <div class="row">
    <label class="chk"><input id="snd" type="checkbox" checked /><span>啾鸣声 Chirp</span></label>
  </div>
  <div class="row">
    <label class="chk"><input id="peck" type="checkbox" checked /><span>啄屏幕 Peck Screen</span></label>
  </div>
  <div class="row wx">
    <div class="lbl"><span>天气联动 Weather</span></div>
    <label class="chk"><input id="wxOn" type="checkbox" /><span>启用天气联动</span></label>
    <div class="note" id="wxNote">开启后将请求所选天气源查询天气(约 30 分钟一次);城市留空时用 IP 粗略定位。</div>
    <div class="wxrow"><span class="k">城市</span><input id="wxCity" type="text" placeholder="留空 = IP 定位" /></div>
    <div class="wxrow"><span class="k">数据源</span>
      <select id="wxProv">
        <option value="open-meteo">Open-Meteo(免费,无需 Key)</option>
        <option value="qweather">和风天气(需 API Key)</option>
      </select>
    </div>
    <div class="wxrow qw-only" hidden><span class="k">API Key</span><input id="wxKey" type="password" /></div>
    <div class="wxrow qw-only" hidden><span class="k">API Host</span><input id="wxHost" type="text" placeholder="devapi.qweather.com" /></div>
    <div class="wxstat" id="wxStat">状态:未开启</div>
  </div>
  <div class="row">
    <div class="lbl"><span>主题 Theme</span></div>
    <div class="themes" id="themes"></div>
  </div>
  <div class="row">
    <div class="lbl"><span>语言 Language</span></div>
    <div class="themes" id="langs"></div>
  </div>
  <script type="module">
    import { emit, listen } from "@tauri-apps/api/event";
    // 初始值直接读共享 localStorage(与主窗同源互通,无竞态——之前页面写死默认值
    // 靠事件推送初始化,关掉重开时推送已被错过 = 滑杆"自动还原");
    // 语言/自启是 Rust 侧状态,打开时主动拉
    const fin = (n, d) => (Number.isFinite(n) ? n : d);   // 脏存储回默认(与 settings.ts 同防护)
    const savedAct = fin(Number(localStorage.getItem("kf_activity") ?? 0.5), 0.5);
    const savedSpd = fin(Number(localStorage.getItem("kf_speed") ?? 1), 1);
    const savedSnd = localStorage.getItem("kf_sound") !== "0";
    const act = document.getElementById("act"), spd = document.getElementById("spd"),
          snd = document.getElementById("snd"), peck = document.getElementById("peck"),
          actV = document.getElementById("actV"),
          spdV = document.getElementById("spdV"), themesEl = document.getElementById("themes"),
          langsEl = document.getElementById("langs");
    const NAMES = [["flat","扁平"],["clay","粘土"],["pixel","像素"],["neon","霓虹"],["ink","水墨"],["watercolor","水彩"]];
    let curTheme = localStorage.getItem("kf_theme") || "flat";
    act.value = savedAct; actV.textContent = savedAct.toFixed(2);
    spd.value = savedSpd; spdV.textContent = savedSpd.toFixed(2);
    snd.checked = savedSnd;
    const savedPeck = localStorage.getItem("kf_peck") !== "0";
    peck.checked = savedPeck;
    for (const [id, name] of NAMES) {
      const b = document.createElement("button");
      b.textContent = name; b.dataset.t = id;
      b.onclick = () => { emit("theme", id); };
      themesEl.appendChild(b);
    }
    function paintTheme() {
      for (const b of themesEl.children) b.classList.toggle("on", b.dataset.t === curTheme);
    }
    paintTheme();
    // 语言(自启已回托盘直达,设置窗只留语言)
    let curLang = "system";
    for (const [id, name] of [["system","跟随系统"],["zh","中文"],["en","English"]]) {
      const b = document.createElement("button");
      b.textContent = name; b.dataset.l = id;
      b.onclick = () => emit("lang", id);
      langsEl.appendChild(b);
    }
    function paintLang() {
      for (const b of langsEl.children) b.classList.toggle("on", b.dataset.l === curLang);
    }
    paintLang();
    listen("lang", (e) => { curLang = e.payload; paintLang(); });
    listen("theme", (e) => { curTheme = e.payload; paintTheme(); });
    emit("settings-need-state", null);   // 主动拉 Rust 侧权威状态(语言;经 settings-open/settings-sync 回传)
    // 滑杆:标签即时,设置载荷 250ms 节流(每 tick emit 会触发 Rust 重建托盘菜单,拖一路重建一路,白烧)
    let actT = 0, spdT = 0;
    act.oninput = () => { actV.textContent = Number(act.value).toFixed(2); clearTimeout(actT); actT = setTimeout(() => emit("setting", "activity:" + act.value), 250); };
    spd.oninput = () => { spdV.textContent = Number(spd.value).toFixed(2); clearTimeout(spdT); spdT = setTimeout(() => emit("setting", "speed:" + spd.value), 250); };
    snd.onchange = () => emit("setting", "sound:" + snd.checked);
    peck.onchange = () => emit("setting", "peck:" + peck.checked);
    // ── 天气联动(v1.5.0):默认关,开启才发首个请求;载荷走主窗 setting 事件重启服务 ──
    const wxOn = document.getElementById("wxOn"), wxCity = document.getElementById("wxCity"),
          wxProv = document.getElementById("wxProv"), wxKey = document.getElementById("wxKey"),
          wxHost = document.getElementById("wxHost"), wxStat = document.getElementById("wxStat");
    const paintQW = () => {
      const qw = wxProv.value === "qweather";
      for (const el of document.querySelectorAll(".qw-only")) el.hidden = !qw;
    };
    wxOn.checked = localStorage.getItem("kf_weather_on") === "1";
    wxCity.value = localStorage.getItem("kf_weather_city") || "";
    wxProv.value = localStorage.getItem("kf_weather_provider") === "qweather" ? "qweather" : "open-meteo";
    wxKey.value = localStorage.getItem("kf_weather_key") || "";
    wxHost.value = localStorage.getItem("kf_weather_host") || "";
    paintQW();
    wxOn.onchange = () => emit("setting", "weather_on:" + wxOn.checked);
    wxProv.onchange = () => { paintQW(); emit("setting", "weather_provider:" + wxProv.value); };
    // 文本框:失焦/回车才提交(逐键触发服务重启=请求轰炸)
    const commitOnDone = (el, key) => {
      el.onchange = () => emit("setting", key + ":" + encodeURIComponent(el.value.trim()));
      el.onkeydown = (ev) => { if (ev.key === "Enter") el.blur(); };
    };
    commitOnDone(wxCity, "weather_city");
    commitOnDone(wxKey, "weather_key");
    commitOnDone(wxHost, "weather_host");
    const zhUI = () => (localStorage.getItem("kf_lang") || "system") === "zh"
      || ((localStorage.getItem("kf_lang") || "system") === "system"
          && (navigator.language || "en").toLowerCase().startsWith("zh"));
    const paintWxStat = (st) => {
      if (!zhUI()) { wxStat.textContent = "Status: " + (st === "ok" ? "ok" : st === "unavailable" ? "unavailable (degraded silently)" : "off"); return; }
      wxStat.textContent = "状态:" + (st === "ok" ? "正常" : st === "unavailable" ? "天气源不可用(已静默降级,不干预行为)" : "未开启");
    };
    paintWxStat(localStorage.getItem("kf_weather_on") === "1" ? "ok" : "off");
    listen("wx-state", (e) => paintWxStat(e.payload?.status));   // 主窗天气状态变化 → 实时标注
    // 主窗回推的当前值(打开时同步真实状态)
    listen("settings-sync", (e) => {
      const v = e.payload;
      act.value = v.activity; actV.textContent = Number(v.activity).toFixed(2);
      spd.value = v.speed; spdV.textContent = Number(v.speed).toFixed(2);
      snd.checked = v.sound;
      if (v.peck !== undefined) peck.checked = v.peck;
      curTheme = v.theme; paintTheme();
      if (v.lang !== undefined) { curLang = v.lang; paintLang(); }
    });
  </script>
</body>
</html>
