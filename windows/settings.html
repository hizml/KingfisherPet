<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>翡 · 设置</title>
  <style>
    body { background: #f4f5f7; margin: 0; padding: 14px 16px; font: 13px system-ui, "Segoe UI", sans-serif;
           background: #f6f6f6; color: #222; user-select: none; }
    .row { margin: 10px 0 14px; }
    .lbl { display: flex; justify-content: space-between; margin-bottom: 4px; }
    input[type=range] { width: 100%; }
    .themes { display: flex; gap: 6px; flex-wrap: wrap; }
    .themes button { padding: 4px 10px; font-size: 12px; cursor: pointer;
      border: 1px solid #bbb; border-radius: 6px; background: #fff; }
    .themes button.on { background: #0e7c86; color: #fff; border-color: #0e7c86; }
    label.chk { display: flex; gap: 6px; align-items: center; cursor: pointer; }
    .wx .note { font-size: 11px; color: #777; margin: 4px 0 8px; }
    [hidden] { display: none !important; }   /* display:flex 会压过 hidden 属性(老板实测 Key 框常显的根因) */
    .wx .wxrow { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .wx .wxrow .k { width: 58px; flex: none; color: #555; }
    .wx .wxrow input, .wx .wxrow select { flex: 1; padding: 3px 6px; border: 1px solid #bbb;
      border-radius: 6px; font: inherit; background: #fff; min-width: 0; }
    .wx .wxstat { font-size: 11px; color: #777; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="row">
    <div class="lbl"><span>活跃度 Activity</span><span id="actV">0.5</span></div>
    <input id="act" type="range" min="0" max="1" step="0.05" value="0.5" />
  </div>
  <div class="row">
    <div class="lbl"><span>动画速度 Speed</span><span id="spdV">1.0</span></div>
    <input id="spd" type="range" min="0.5" max="1.5" step="0.05" value="1.0" />
  </div>
  <div class="row">
    <label class="chk"><input id="snd" type="checkbox" checked /><span>啾鸣声 Chirp</span></label>
  </div>
  <div class="row">
    <label class="chk"><input id="peck" type="checkbox" checked /><span>啄屏幕 Peck Screen</span></label>
  </div>
  <div class="row wx">
    <div class="lbl"><span>天气联动 Weather</span></div>
    <label class="chk"><input id="wxOn" type="checkbox" /><span id="wxOnL">启用天气联动</span></label>
    <div class="note" id="wxNote">开启后将请求所选天气源查询天气(约 30 分钟一次);城市必填,留空默认北京;填短名(如 北京/顺义,勿带"市/区"后缀)。</div>
    <div class="wxrow"><span class="k" id="cityK">城市</span><input id="wxCity" type="text" placeholder="如:北京 / 顺义;留空 = 北京" /></div>
    <div class="wxrow"><span class="k" id="provK">数据源</span>
      <select id="wxProv">
        <option value="open-meteo">Open-Meteo(免费,无需 Key)</option>
        <option value="qweather">和风天气(需 API Key)</option>
      </select>
    </div>
    <div class="wxrow qw-only" hidden><span class="k">API Key</span><input id="wxKey" type="password" /><button id="wxKeyTest" style="flex:none;padding:3px 10px;border:1px solid #0e7c86;color:#0e7c86;border-radius:6px;background:#fff;cursor:pointer;">测试</button></div>
    <div class="wxrow qw-only" hidden><span class="k">API Host</span><input id="wxHost" type="text" placeholder="devapi.qweather.com 或 专属 xxx.qweatherapi.com" /></div>
    <div class="wxstat" id="wxStat">状态:未开启</div>
  </div>
  <div class="wx">
    <div class="wxh">🐦 局域网小鸟 LAN Birds</div>
    <label class="chk"><input id="lanOn" type="checkbox" /><span id="lanOnL">发现同一网络里的翡(对唱/串门/送鱼)</span></label>
    <div class="wxstat" id="lanName"></div>
    <div class="wxstat" id="lanNote"></div>
    <div class="wxstat" id="lanPeers">邻居:—</div>
  </div>
  <div class="row">
    <div class="lbl"><span>主题 Theme</span></div>
    <div class="themes" id="themes"></div>
  </div>
  <div class="row">
    <div class="lbl"><span>语言 Language</span></div>
    <div class="themes" id="langs"></div>
  </div>
  <script type="module">
    import { emit, listen } from "@tauri-apps/api/event";
    import { invoke } from "@tauri-apps/api/core";
    // 初始值直接读共享 localStorage(与主窗同源互通,无竞态——之前页面写死默认值
    // 靠事件推送初始化,关掉重开时推送已被错过 = 滑杆"自动还原");
    // 语言/自启是 Rust 侧状态,打开时主动拉
    const fin = (n, d) => (Number.isFinite(n) ? n : d);   // 脏存储回默认(与 settings.ts 同防护)
    const savedAct = fin(Number(localStorage.getItem("kf_activity") ?? 0.5), 0.5);
    const savedSpd = fin(Number(localStorage.getItem("kf_speed") ?? 1), 1);
    const savedSnd = localStorage.getItem("kf_sound") !== "0";
    const act = document.getElementById("act"), spd = document.getElementById("spd"),
          snd = document.getElementById("snd"), peck = document.getElementById("peck"),
          actV = document.getElementById("actV"),
          spdV = document.getElementById("spdV"), themesEl = document.getElementById("themes"),
          langsEl = document.getElementById("langs");
    const NAMES = [["flat","扁平"],["clay","粘土"],["pixel","像素"],["neon","霓虹"],["ink","水墨"],["watercolor","水彩"]];
    let curTheme = localStorage.getItem("kf_theme") || "flat";
    act.value = savedAct; actV.textContent = savedAct.toFixed(2);
    spd.value = savedSpd; spdV.textContent = savedSpd.toFixed(2);
    snd.checked = savedSnd;
    const savedPeck = localStorage.getItem("kf_peck") !== "0";
    peck.checked = savedPeck;
    for (const [id, name] of NAMES) {
      const b = document.createElement("button");
      b.textContent = name; b.dataset.t = id;
      b.onclick = () => { emit("theme", id); };
      themesEl.appendChild(b);
    }
    function paintTheme() {
      for (const b of themesEl.children) b.classList.toggle("on", b.dataset.t === curTheme);
    }
    paintTheme();
    // 语言(自启已回托盘直达,设置窗只留语言)
    let curLang = "system";
    for (const [id, name] of [["system","跟随系统"],["zh","中文"],["en","English"]]) {
      const b = document.createElement("button");
      b.textContent = name; b.dataset.l = id;
      b.onclick = () => emit("lang", id);
      langsEl.appendChild(b);
    }
    function paintLang() {
      for (const b of langsEl.children) b.classList.toggle("on", b.dataset.l === curLang);
    }
    paintLang();
    listen("lang", (e) => { curLang = e.payload; paintLang(); applyLang(); });   // v1.7.2:切语言全窗即时适配
    listen("theme", (e) => { curTheme = e.payload; paintTheme(); });
    emit("settings-need-state", null);   // 主动拉 Rust 侧权威状态(语言;经 settings-open/settings-sync 回传)
    // 滑杆:标签即时,设置载荷 250ms 节流(每 tick emit 会触发 Rust 重建托盘菜单,拖一路重建一路,白烧)
    let actT = 0, spdT = 0;
    act.oninput = () => { actV.textContent = Number(act.value).toFixed(2); clearTimeout(actT); actT = setTimeout(() => emit("setting", "activity:" + act.value), 250); };
    spd.oninput = () => { spdV.textContent = Number(spd.value).toFixed(2); clearTimeout(spdT); spdT = setTimeout(() => emit("setting", "speed:" + spd.value), 250); };
    snd.onchange = () => emit("setting", "sound:" + snd.checked);
    peck.onchange = () => emit("setting", "peck:" + peck.checked);
    // ── 天气联动(v1.5.0):默认关,开启才发首个请求;载荷走主窗 setting 事件重启服务 ──
    const wxOn = document.getElementById("wxOn"), wxCity = document.getElementById("wxCity"),
          wxProv = document.getElementById("wxProv"), wxKey = document.getElementById("wxKey"),
          wxHost = document.getElementById("wxHost"), wxStat = document.getElementById("wxStat");
    // 语言判定与状态行文案:必须先于 applyLang 声明(v1.7.17 TDZ 复发实锤——
    // 初始化调用曾插在本声明之前,点击「测试」处理器里 zhUI() 永久 TDZ 静默崩)
    const zhUI = () => (localStorage.getItem("kf_lang") || "system") === "zh"
      || ((localStorage.getItem("kf_lang") || "system") === "system"
          && (navigator.language || "en").toLowerCase().startsWith("zh"));
    const paintWxStat = (st) => {
      if (!zhUI()) { wxStat.textContent = "Status: " + (st === "ok" ? "ok" : st === "unavailable" ? "unavailable (degraded silently)" : "off"); return; }
      wxStat.textContent = "状态:" + (st === "ok" ? "正常" : st === "unavailable" ? "天气源不可用(已静默降级,不干预行为)" : "未开启");
    };
    // v1.7.2 设置窗完整中英适配(老板:切语言所有内容都要适配;此前天气/LAN 区中文硬编码)
    const applyLang = () => {
      const zh = zhUI();
      const T = (e, z, en) => { if (e) e.textContent = zh ? z : en; };
      T(document.getElementById("wxOnL"), "启用天气联动", "Enable weather integration");
      document.getElementById("wxNote").textContent = zh
        ? '开启后将请求所选天气源查询天气(约 30 分钟一次);城市必填,留空默认北京;填短名(如 北京/顺义,勿带"市/区"后缀)。'
        : "When on, the selected provider is queried every ~30 min; city is required and defaults to Beijing; use short names (no suffix).";
      T(document.getElementById("cityK"), "城市", "City");
      document.getElementById("wxCity").placeholder = zh ? "如:北京 / 顺义;留空 = 北京" : "e.g. Beijing; empty = Beijing";
      T(document.getElementById("provK"), "数据源", "Provider");
      document.getElementById("wxProv").options[0].textContent = zh ? "Open-Meteo(免费,无需 Key)" : "Open-Meteo (free, no key)";
      document.getElementById("wxProv").options[1].textContent = zh ? "和风天气(需 API Key)" : "QWeather (API key required)";
      T(document.getElementById("lanOnL"), "发现同一网络里的翡(对唱/串门/送鱼)", "Discover other KingfisherPets on this network");
      document.getElementById("lanNote").textContent = zh
        ? '需同一路由器且未开「AP 隔离/客户端隔离」;Windows 首次启动若弹防火墙询问请点「允许」(专用网络),拦了就互相发现不了。公司/公共 WiFi 可能发现不到邻居。广播仅代号与主题,不含 IP/主机名。'
        : "Needs the same router without AP/client isolation; allow the app through Windows Firewall when prompted (private network), or peers cannot find each other. Corporate/public Wi-Fi may block discovery. Broadcasts codename + theme only, never IP/hostname.";
      document.getElementById("wxStat").textContent = zh ? "状态:未开启" : "Status: off";
      renderPeers();
    };
    const paintQW = () => {
      const qw = wxProv.value === "qweather";
      for (const el of document.querySelectorAll(".qw-only")) el.hidden = !qw;
    };
    // v1.7.8:两窗 localStorage 隔离——以主窗推来的真值填充(自己的存储是空/陈旧的);
    // v1.7.18:载荷带 status,状态行初值也由真值驱动(此前读隔离存储恒显示「未开启」)
    const fillWeather = (w) => {
      if (!w) return;
      wxOn.checked = !!w.on;
      wxCity.value = w.city || "北京";
      wxProv.value = w.provider === "qweather" ? "qweather" : "open-meteo";
      wxKey.value = w.key || "";
      wxHost.value = w.host || "devapi.qweather.com";
      paintQW();   // 按真 provider 显隐 Key/Host 行(老板实锤:选和风再开窗输入框消失)
      paintWxStat(w.status || (w.on ? "ok" : "off"));
    };
    listen("settings-weather", (e) => fillWeather(e.payload));
    wxOn.checked = false; wxCity.value = ""; wxKey.value = ""; wxHost.value = "";   // 等主窗真值
    // 粘贴净化(实时):Key/Host 不得含空白/换行(控制台复制常带尾部换行)
    const cleanWX = () => {
      for (const el of [wxKey, wxHost]) {
        const c = el.value.replace(/\s+/g, "").replace(/^https?:\/\//, "");
        if (c !== el.value) { const p = el.selectionStart; el.value = c; try { el.setSelectionRange(p, p); } catch (e) { /* */ } }
      }
    };
    wxKey.oninput = wxHost.oninput = () => { cleanWX(); };
    // (初始化调用移到脚本末尾——applyLang 内调 renderPeers,此处其 const 尚未声明,
    // TDZ ReferenceError 会杀死整个脚本:wxProv.onchange/lanOn.onchange 全都挂不上
    // =选和风无反应+LAN 勾不上的真根因,老板 v1.7.16 实锤)
    // (天气文本框的提交统一走下方 commitOnDone:失焦/回车才提交,且 trim——
    //  此处曾有三行 onchange 先挂后被覆盖的死代码,v1.7.18 清理)
    wxOn.onchange = () => emit("setting", "weather_on:" + wxOn.checked);
    // 局域网小鸟(v1.7.0):开关走 lansvc;邻居列表支持允许/拒绝(配对=隐私红线)
    const lanOn = document.getElementById("lanOn"),
          lanName = document.getElementById("lanName"),
          lanPeers = document.getElementById("lanPeers");
    const renderPeers = async () => {
      // 代号以 Rust 权威 cfg 为准(v1.7.18 前这里引用了从未 import 的裸标识符 lan,
      // 每次调用 ReferenceError ——「我的代号」与邻居列表自 v1.7.0 起从未工作过)
      const myName = (lanSvc && lanSvc.cfg && lanSvc.cfg.name) || "";
      if (lanName) lanName.textContent = myName ? ("我的代号:" + myName) : "我的代号:…";
      let peers = [];
      try { peers = await invoke("lan_peers"); } catch { peers = []; }
      if (!peers.length) { lanPeers.textContent = zhUI() ? "邻居:暂无" : "Neighbors: none"; return; }
      lanPeers.innerHTML = "";
      for (const n of peers) {
        const b = document.createElement("button");
        b.style.cssText = "margin:2px 6px 2px 0;padding:1px 8px;border-radius:6px;border:1px solid #999;background:#fff;cursor:pointer;font-size:11px;";
        const st = (lanSvc && lanSvc.allowed.includes(n)) ? "✅ " : ((lanSvc && lanSvc.denied.includes(n)) ? "🚫 " : "❓ ");
        b.textContent = st + n + (st === "❓ " ? (zhUI() ? "(允许)" : " (allow)") : "");
        b.onclick = () => { if (lanSvc) lanSvc.allowPeer(n); renderPeers(); };
        lanPeers.appendChild(b);
      }
    };
    let lanSvc = null;   // lansvc 动态加载(es2021 无顶层 await)
    import("./src/lansvc").then(async (m) => {
      lanSvc = m.lan;
      const cfg = await m.lan.loadCfg().catch(() => null);   // Rust 权威(老板实锤:localStorage 关窗丢勾)
      lanOn.checked = cfg ? cfg.on : m.lan.enabled;
      renderPeers();
    });
    // API Key 测试(老板要求):打和风 geo 探一口,通不通状态行直说
    document.getElementById("wxKeyTest").onclick = async () => {
      // 粘贴净化(与主窗天气服务同口径):剥空白/换行+协议前缀(老板实测:粘贴带脏字符→不通)
      const key = wxKey.value.replace(/\s+/g, "");
      const host0 = wxHost.value.replace(/\s+/g, "").replace(/^https?:\/\//, "");
      const host = host0 || "devapi.qweather.com";
      wxStat.textContent = zhUI() ? "状态:测试中…" : "Status: testing…";
      try {
        // 协议自适应:新版专属 Host(*.qweatherapi.com)=X-QW-Api-Key Header+/geo/v2;
        // 老版=query key+/v2(老板实测:新 Key 走老协议必 404/401)
        const isNew = host.toLowerCase().endsWith(".qweatherapi.com");
        const path = isNew ? "/geo/v2/city/lookup" : "/v2/city/lookup";
        const url0 = `https://${host}${path}?location=beijing&number=1`;
        const r = isNew
          ? await fetch(url0, { signal: AbortSignal.timeout(10000), headers: { "X-QW-Api-Key": key } })
          : await fetch(`${url0}&key=${encodeURIComponent(key)}`, { signal: AbortSignal.timeout(10000) });
        const j = await r.json().catch(() => ({}));
        const ok = r.ok && Array.isArray(j.location) && j.location.length > 0;
        const errDetail = j.error && j.error.status ? ` type=${j.error.status}` : (j.code ? ` code ${j.code}` : "");
        wxStat.textContent = ok
          ? (zhUI() ? `状态:Key 有效(${host})` : `Status: key works (${host})`)
          : (zhUI() ? `状态:Key 无效(HTTP ${r.status}${errDetail})` : `Status: key rejected (HTTP ${r.status}${errDetail})`);
        // 测试通过 → 把这份 Key/Host 推给主窗重刷天气服务(对齐 Mac「测试通过即重刷」;
        // 此前成功只改文案,状态要等下个周期才翻身——v1.7.13 老板实锤的同款问题)
        if (ok) {
          emit("setting", "weather_key:" + encodeURIComponent(key));
          emit("setting", "weather_host:" + encodeURIComponent(host));
        }
      } catch (e) {
        wxStat.textContent = zhUI() ? `状态:测试失败(网络/Host 不通)` : "Status: test failed (network/host)";
      }
    };
    lanOn.onchange = () => { if (lanSvc) lanSvc.enabled = lanOn.checked; emit("setting", "lan:" + lanOn.checked); renderPeers(); };
    renderPeers();
    import("@tauri-apps/api/event").then(({ listen: _lsn }) => _lsn("lan-peers-changed", () => renderPeers()));
    wxProv.onchange = () => { paintQW(); emit("setting", "weather_provider:" + wxProv.value); };
    // 文本框:失焦/回车才提交(逐键触发服务重启=请求轰炸)
    const commitOnDone = (el, key) => {
      el.onchange = () => emit("setting", key + ":" + encodeURIComponent(el.value.trim()));
      el.onkeydown = (ev) => { if (ev.key === "Enter") el.blur(); };
    };
    commitOnDone(wxCity, "weather_city");
    commitOnDone(wxKey, "weather_key");
    commitOnDone(wxHost, "weather_host");
    // 初始化(zhUI/paintWxStat 已上移至 applyLang 之前声明;状态行初值等主窗 settings-weather 真值)
    applyLang();
    paintQW();
    listen("wx-state", (e) => paintWxStat(e.payload?.status));   // 主窗天气状态变化 → 实时标注
    // 主窗回推的当前值(打开时同步真实状态)
    listen("settings-sync", (e) => {
      const v = e.payload;
      act.value = v.activity; actV.textContent = Number(v.activity).toFixed(2);
      spd.value = v.speed; spdV.textContent = Number(v.speed).toFixed(2);
      snd.checked = v.sound;
      if (v.peck !== undefined) peck.checked = v.peck;
      curTheme = v.theme; paintTheme();
      if (v.lang !== undefined) { curLang = v.lang; paintLang(); }
    });
  </script>
</body>
</html>
