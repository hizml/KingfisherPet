<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh}
img,div.fx{position:fixed;pointer-events:none}
.kf-sun-rot{animation:kf-sun-rot 14s linear infinite}
.kf-sun-pulse{animation:kf-sun-pulse 1.4s ease-in-out infinite alternate}
@keyframes kf-sun-rot{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes kf-sun-pulse{from{transform:scale(0.95)}to{transform:scale(1.1)}}
@keyframes kf-zzz{0%{opacity:0;transform:translate(0,0)}12%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx,0px),-80px)}}
@keyframes kf-note{0%{opacity:0;transform:translateY(0)}12%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
</style>
</head><body>
<script>
// 探针(不依赖 Tauri API):页面是否执行到这里 + 模块是否抛错
localStorage.setItem("kf_poop_probe", "script-start " + Date.now());
localStorage.removeItem("kf_poop_err");   // 清上一轮的残影
window.addEventListener("error", (e) => {
  localStorage.setItem("kf_poop_err", (e.message || "") + " @ " + (e.filename || "") + ":" + (e.lineno || ""));
});
</script>
<script type="module">
import { listen, emit } from "@tauri-apps/api/event";
localStorage.setItem("kf_poop_probe", "module-import-ok " + Date.now());
const DPR = window.devicePixelRatio || 1;   // 物理→CSS 换算(之前整个文件没声明,所有内容处理器首事件即崩)
try {
let theme = localStorage.getItem("kf_theme") || "flat";
listen("theme", (e) => { theme = e.payload; });   // 主窗切主题(reload 不影响本窗),素材跟着换
// 载荷已是逻辑像素(behavior 统一逻辑坐标),直接用

// 唤醒宽限:3s 内承载面监测不判"没了"(唤醒瞬间窗口层级混乱,否则满屏屎同时重落)
const graceState = { until: 0 };   // 唤醒宽限截止时刻
listen("poop-grace", () => { graceState.until = performance.now() + 3000; });

// 屎贴图 alpha 裁剪:poop.png 是 256 画布、内容只占中间一坨;
// 直接缩到 30x20 会挤成 ~18x4 的细线。按主题裁出内容 dataURL(macOS cropToAlpha 同款)
const poopSpriteCache = {};
async function poopSprite(t) {
  if (poopSpriteCache[t]) return poopSpriteCache[t];
  const img = new Image();
  img.src = `${import.meta.env.BASE_URL}Sprites/${t}/poop.png`;
  await img.decode().catch(() => {});
  try {
    const cv = document.createElement("canvas");
    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    const c2 = cv.getContext("2d");
    c2.drawImage(img, 0, 0);
    const d = c2.getImageData(0, 0, cv.width, cv.height).data;
    let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
    for (let yy = 0; yy < cv.height; yy++) for (let xx = 0; xx < cv.width; xx++) {
      if (d[(yy * cv.width + xx) * 4 + 3] > 20) {
        if (xx < x0) x0 = xx; if (xx > x1) x1 = xx;
        if (yy < y0) y0 = yy; if (yy > y1) y1 = yy;
      }
    }
    if (x1 < 0) throw 0;
    const cw = x1 - x0 + 1, chh = y1 - y0 + 1;
    const c3 = document.createElement("canvas");
    c3.width = 30 * 2; c3.height = Math.round(30 * 2 * chh / cw);   // 宽 30 逻辑(2x 清晰),高按内容比
    c3.getContext("2d").drawImage(cv, x0, y0, cw, chh, 0, 0, c3.width, c3.height);
    poopSpriteCache[t] = { url: c3.toDataURL(), w: 30, h: c3.height / 2 };
  } catch {
    poopSpriteCache[t] = { url: img.src, w: 30, h: 20 };
  }
  return poopSpriteCache[t];
}

// 屎下落(物理:落到 landingY 表面,坐 8-15s,淡出;时长随动画速度)
let poopCount = 0;
listen("poop-drop", async (e) => {
  const { x: px0, y: py0, landingY: pl, fallSec, spd, hwnd } = e.payload;
  const x = px0 / DPR, y = py0 / DPR, landingY = pl / DPR;
  const spr = await poopSprite(theme);
  if (poopCount >= 8) { const old = document.querySelector("img[data-poop]"); old?.remove(); }   // 上限 8
  const sp = spd ?? 1;
  const img = document.createElement("img");
  img.dataset.poop = "1";
  img.src = spr.url;
  img.style.left = (x - spr.w / 2) + "px";
  img.style.top = y + "px";
  img.style.width = spr.w + "px"; img.style.height = spr.h + "px";
  img.style.transition = `top ${fallSec / sp}s ease-in,opacity 1.2s`;
  document.body.appendChild(img);
  poopCount++;
  void img.offsetHeight;   // 强制 reflow 钉住起点(单 rAF 与首帧同批会被合并,直接渲染在终点 = 看不到下落)
  requestAnimationFrame(() => { img.style.top = (landingY - spr.h) + "px"; });   // 落到表面(底边贴地)
  const sit = (8000 + Math.random() * 7000) / sp;
  const fadeAt = fallSec / sp * 1000 + sit;
  setTimeout(() => { img.style.opacity = "0"; }, fadeAt);
  setTimeout(() => { img.remove(); poopCount--; }, fadeAt + 1400);
  // 承载面监测:窗口移走/消失 → 重新下落到下一表面(macOS resumeFall)
  // 节能:查询每 3 跳一次(≈1 IPC/s;macOS 同哲学——查询帧 1/10 采样,不逐帧查);
  // 迟滞:连续 3 次坏查询(≈3s)才重落;唤醒宽限 3s 内不判
  if (hwnd) {
    let bad = 0, tick = 0;
    const poll = setInterval(async () => {
      if (!img.isConnected) { clearInterval(poll); return; }
      if (stageDormant) return;                        // 睡眠:不轮询(夜里 IPC 零)
      if (++tick % 3 !== 0) return;                    // 门控:3 跳一查
      if (performance.now() < fadeAt - 500) return;   // 落定前不查
      if (performance.now() < graceState.until) return;   // 唤醒宽限
      try {
        const r = await (await import("@tauri-apps/api/core")).invoke("window_rect_cmd", { hwndVal: hwnd });
        // 承载判定:屎底边(landingY)应坐在窗口上沿(r[1])上且横跨窗口。
        // 之前只比 x——窗口【垂直】移开时屎 x 仍在范围内 → 判定不触发 → 屎悬空(Mac 会掉)
        const gone = !r || px0 < r[0] || px0 > r[0] + r[2] || Math.abs(r[1] - pl) > 8;
        if (gone) {
          bad++;
          if (bad < 3) return;   // 迟滞
          clearInterval(poll);
          // 找新落点:该 x 下方最近表面(简化:直接掉到传入的地面兜底 = landingY 下方一屏)
          let nl = pl + 600;
          try {
            const list = await (await import("@tauri-apps/api/core")).invoke("surfaces_below_cmd", { x: px0 });
            let best = -1e9;
            for (const s2 of list) { const top = s2[1]; if (top > pl + 6 && top < best) best = top; }   // 同 dropPoopAt:方向已翻转
            if (best > -1e9) nl = best;
          } catch { /* */ }
          const nlL = nl / DPR;
          img.style.transition = `top ${Math.max(0.2, (nlL - landingY) / 220 / sp)}s ease-in`;
          void img.offsetHeight;   // 钉住起点再落(否则看不到下落)
          requestAnimationFrame(() => { img.style.top = (nlL - spr.h) + "px"; });
        }
      } catch { clearInterval(poll); }
    }, 350);
  }
});

// 特效(屏幕坐标):水花/音符/zzz/太阳。搬自 effects.ts(原在鸟窗内被 160px 裁剪)
function imgEl(name, w, h) {
  const img = document.createElement("img");
  img.src = `${import.meta.env.BASE_URL}Sprites/${theme}/${name}.png`;
  img.style.width = w + "px"; img.style.height = h + "px";
  return img;
}
let fxSpd = 1;   // 动画速度(1=正常);时长 = 基准 / fxSpd(快→短)
let zzzEl = null;   // zzz 单实例(macOS 池化单窗同款:每次 tick 替换,不堆叠)
listen("fx", (e) => {
  const { kind, x: px, y: py, dur, spd } = e.payload;
  fxSpd = spd ?? 1;
  const x = px / DPR, y = py / DPR;   // 物理 → CSS 逻辑
  if (kind === "splash") {
    const sp2 = 1 / fxSpd;
    const ring = imgEl("splash_ring", 30, 30);
    ring.style.left = (x - 15) + "px"; ring.style.top = (y - 15) + "px";
    ring.style.transform = "scale(0.3)"; ring.style.opacity = "0.9";
    ring.style.transition = `transform ${0.55 * sp2}s ease-out,opacity ${0.55 * sp2}s ease-out`;
    document.body.appendChild(ring);
    requestAnimationFrame(() => { ring.style.transform = "scale(3.2)"; ring.style.opacity = "0"; });
    setTimeout(() => ring.remove(), 700 * sp2);
    // 9 滴水珠:向上扇形抛出再落(macOS 同款)
    for (let i = 0; i < 9; i++) {
      const ang = Math.PI * 0.15 + (i / 8) * Math.PI * 0.7;
      const dx = Math.cos(ang) * 58, dy = -Math.sin(ang) * 46 + 22;
      const d = imgEl("splash_drop", 6, 6);
      d.style.left = x + "px"; d.style.top = y + "px";
      d.style.transition = `transform ${0.6 * sp2}s cubic-bezier(0.2,0.8,0.6,1),opacity ${0.6 * sp2}s`;
      document.body.appendChild(d);
      requestAnimationFrame(() => { d.style.transform = `translate(${dx}px,${dy}px)`; d.style.opacity = "0"; });
      setTimeout(() => d.remove(), 650 * sp2);
    }
  } else if (kind === "notes") {
    // macOS 同款:3 个音符,40px,梯次 0.25s,上浮 40px,keyframe 曲线 0/12%/70%/100%
    for (let i = 0; i < 3; i++) {
      const n = imgEl("note", 40, 40);
      n.style.left = (x - 20 + (i - 1) * 14) + "px"; n.style.top = (y - 20) + "px";
      n.style.opacity = "0";
      n.style.animation = `kf-note ${1.2 / fxSpd}s ease-out ${i * 0.25 / fxSpd}s forwards`;
      document.body.appendChild(n);
      setTimeout(() => n.remove(), ((i * 0.25 + 1.2) / fxSpd) * 1000 + 150);
    }
  } else if (kind === "zzz") {
    // macOS 同款:【单实例替换】——每次 tick 替换上一个,28-40px 随机,
    // 1.8s 完整生命周期(12% 淡入,70% 前保持,100% 淡尽),不再堆叠多个慢慢消失
    if (!zzzEl) { zzzEl = imgEl("zzz", 28, 28); zzzEl.style.opacity = "0"; document.body.appendChild(zzzEl); }
    const sz = 28 + Math.random() * 12;
    zzzEl.style.width = sz + "px"; zzzEl.style.height = sz + "px";
    zzzEl.style.left = (x - sz / 2 + (Math.random() * 24 - 12)) + "px";
    zzzEl.style.top = y + "px";
    zzzEl.style.setProperty("--dx", (Math.random() * 36 - 18) + "px");
    zzzEl.style.animation = "none"; void zzzEl.offsetWidth;   // 重启动画
    zzzEl.style.animation = `kf-zzz ${1.8 / fxSpd}s ease-out forwards`;
  } else if (kind === "sun") {
    document.querySelector("div.fx-sun")?.remove();   // 单实例(防堆叠)
    const c = document.createElement("div");
    c.className = "fx fx-sun";   // 一行写全(classList 先加会被 className 覆盖 → 去重失效)
    c.style.left = (x - 60) + "px";
    c.style.top = Math.max(y - 60, -58) + "px";   // 鸟在屏顶时太阳至少露一半(舞台钳在屏内,对齐 Mac 越屏观感)
    c.style.width = "120px"; c.style.height = "120px";
    const rays = imgEl("sun_rays", 120, 120); rays.classList.add("kf-sun-rot");
    const disk = imgEl("sun_disk", 58, 58);
    disk.style.position = "absolute"; disk.style.left = "31px"; disk.style.top = "31px";
    disk.classList.add("kf-sun-pulse");
    c.appendChild(rays); c.appendChild(disk);
    document.body.appendChild(c);
    setTimeout(() => c.remove(), dur * 1000);
  }
});
// 树枝(屏幕坐标):悬空落脚的预显树枝——鸟到之前树枝先到
const branchImg = document.createElement("img");
branchImg.style.position = "fixed";
branchImg.style.width = "160px"; branchImg.style.height = "60px";
branchImg.style.pointerEvents = "none"; branchImg.style.display = "none";
document.body.appendChild(branchImg);
listen("branch", (e) => {
  const { show, x: bx, y: by, theme } = e.payload;
  const x = bx / DPR, y = by / DPR;   // 物理 → CSS
  if (!show) { branchImg.style.display = "none"; return; }
  branchImg.src = `${import.meta.env.BASE_URL}Sprites/${theme}/branch.png`;
  branchImg.style.left = (x - 80) + "px";     // 居中于脚点
  branchImg.style.top = (y - 30) + "px";      // 枝面中线(60px 高的 30px 处)托住脚
  branchImg.style.display = "block";
});

// 地面阴影(逻辑坐标):锚定地面、鸟正下方,飞高变大变淡
const shadowImg = document.createElement("img");
shadowImg.style.position = "fixed";
shadowImg.style.width = "150px"; shadowImg.style.height = "40px";
shadowImg.style.pointerEvents = "none"; shadowImg.style.display = "none";
document.body.appendChild(shadowImg);
listen("shadow", (e) => {
  const { show, x: sx, y: sy, w: sw2, h: sh2, opacity, theme: th } = e.payload;
  const x = sx / DPR, y = sy / DPR, w = sw2, h = sh2;   // 物理 → CSS(尺寸已是逻辑量)
  if (!show) { shadowImg.style.display = "none"; return; }
  if (th && shadowImg.dataset.t !== th) { shadowImg.dataset.t = th; shadowImg.src = `${import.meta.env.BASE_URL}Sprites/${th}/shadow.png`; }   // 同主题不重设(重设会触发解码/布局)
  shadowImg.style.width = w + "px"; shadowImg.style.height = h + "px";
  shadowImg.style.left = (x - w / 2) + "px";
  shadowImg.style.top = (y - h / 2) + "px";
  shadowImg.style.opacity = String(opacity);
  shadowImg.style.display = "block";
});

listen("stage-origin", (e) => {   // 舞台建在虚拟桌面原点,body 平移回 (0,0) 语义
  const { x, y } = e.payload;
  document.body.style.transform = `translate(${-x}px, ${-y}px)`;
});
// 健康探针:主窗 ping → 本页 pong(诊断用:页面活着/事件链通,一眼判定)
listen("stage-ping", () => { emit("stage-pong", "poop"); });
// 睡眠/唤醒:暂停/恢复坐屎轮询(Rust 广播到所有窗口)
let stageDormant = false;
listen("sleep", () => { stageDormant = true; });
listen("wake", () => { stageDormant = false; graceState.until = performance.now() + 3000; });

localStorage.setItem("kf_poop_probe", "module-done " + Date.now());
emit("child-ready", "poop");   // 告诉主窗 listener 已注册(防首次 emit 丢失)
} catch (err) {
  localStorage.setItem("kf_poop_err", "module: " + (err && err.message || err));
  throw err;
}
</script>
</body></html>
