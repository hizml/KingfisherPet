<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>翡</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 160px; height: 160px; }
    #pet { width: 160px; height: 160px; }
    #sprite { width: 160px; height: 160px; display: block; }
    #effects { position: absolute; left: 0; top: 0; width: 160px; height: 160px; pointer-events: none; overflow: visible; }
    @keyframes kf-sun-rot { to { transform: rotate(360deg); } }
    @keyframes kf-sun-pulse { from { transform: scale(0.95); } to { transform: scale(1.1); } }
  </style>
</head>
<body>
  <div id="pet"><img id="sprite" alt="" /></div>
  <div id="effects"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
